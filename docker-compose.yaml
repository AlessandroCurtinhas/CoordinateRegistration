services:

  coordinateregistration-api:
    build: .
    ports: 
      - 8080:80
    networks:
      - public
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Teste@123456
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Teste@123456", "-C", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - public

networks:
  public:
